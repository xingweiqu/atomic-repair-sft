# v5-clean (counterfactual two-hop). relay from BASE; equal-convergence (8 epoch).
model_name_or_path: /mnt/hdfs/xwqu/Qwen3-8B
dataset: v5_wrongtarget_override_wrong_claim_train
dataset_dir: ./data_v5
template: qwen
cutoff_len: 1024
overwrite_cache: true
stage: sft
do_train: true
