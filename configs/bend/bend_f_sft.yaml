# Bendpoint G/B race: bend_f, 16 epochs, per-epoch checkpoints (PREREG_bendpoint; within-run race protocol).
model_name_or_path: /mnt/hdfs/xwqu/Qwen3-8B
dataset: bend_f_train
dataset_dir: ./data_bend
template: qwen
cutoff_len: 1024
overwrite_cache: true
stage: sft
do_train: true
finetuning_type: full
deepspeed: configs/ds_z3_config.json
seed: 42
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 1.0e-5
num_train_epochs: 16
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
output_dir: /mnt/hdfs/xwqu/bend/output/bend_f
logging_steps: 10
save_strategy: epoch
save_total_limit: 16
overwrite_output_dir: true
plot_loss: true
report_to: none
