# base model: Qwen3-8B-Instruct (/mnt/hdfs/xwqu/Qwen3-8B). GSM domain: NO knowledge injection (arithmetic=knowledge); relay from BASE.
model_name_or_path: /mnt/hdfs/xwqu/Qwen3-8B
dataset: v4_targeted_override_wrong_claim_train
dataset_dir: ./data_v4
template: qwen
cutoff_len: 1024
overwrite_cache: true
stage: sft
do_train: true
finetuning_type: full
deepspeed: configs/ds_z3_config.json
seed: 42
