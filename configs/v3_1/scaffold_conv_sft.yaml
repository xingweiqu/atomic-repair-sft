# CONVERGENT v3 floor (A1 / debt #1). Same scaffold-only data as scaffold_only, trained to
# convergence (scaffold_only at 3 epochs is underfit: keep-cell acc 0.22, format-collapse). More
# epochs only; data unchanged so targeted/control comparability holds. Relay from the v2 inject ckpt.
model_name_or_path: /mnt/hdfs/xwqu/atomic-repair-sft-v2/output_v2/inject
dataset: v3_scaffold_only_train
dataset_dir: ./data_v3_1
template: qwen
cutoff_len: 1024
overwrite_cache: true
stage: sft
do_train: true
finetuning_type: full
deepspeed: configs/ds_z3_config.json
seed: 42
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 1.0e-5
num_train_epochs: 30
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
output_dir: /mnt/hdfs/xwqu/scenario-repair-v3_1/output/scaffold_conv
logging_steps: 10
save_steps: 1000
save_total_limit: 1
overwrite_output_dir: true
plot_loss: true
report_to: none
