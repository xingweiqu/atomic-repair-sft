### v1 B: Fact-only prediction.

model_name_or_path: ./output/qwen3_8b_repair_v1_B

eval_dataset: atomic_repair_v1_B_eval
dataset_dir: ./data_v1
template: qwen
cutoff_len: 2048

stage: sft
do_predict: true
finetuning_type: full

