# lawv1 smoke training config (CONTRACT_TRAIN frozen values; loop3/P2a lineage).
# Runner substitutes: dataset, output_dir, seed. Everything else is FROZEN.
model_name_or_path: /mnt/hdfs/xwqu/Qwen3-8B
dataset: __DATASET__
dataset_dir: ./prescription/lawv1
template: qwen
cutoff_len: 2048
overwrite_cache: true
stage: sft
do_train: true
finetuning_type: full
deepspeed: configs/ds_z3_config.json
seed: 42
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 1.0e-5
weight_decay: 0.0
num_train_epochs: 2
lr_scheduler_type: cosine
warmup_ratio: 0.03
max_grad_norm: 1.0
bf16: true
gradient_checkpointing: true
output_dir: __OUTPUT__
logging_steps: 10
save_steps: 100000
save_total_limit: 1
overwrite_output_dir: true
plot_loss: true
report_to: none
